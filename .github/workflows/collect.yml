name: Collect questions (daily)
on:
  schedule:
    - cron: "17 3 * * *"   # every day 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: question-bank
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      FASTEMBED_CACHE_PATH: .fastembed_cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-bge-small-v1
      - run: pip install -r requirements.txt
      - name: Weekly re-read of the curated repos (Sundays)
        run: '[ "$(date -u +%u)" = "7" ] && python -m iqg seed || echo "not Sunday"'
      - run: python -m iqg collect
      - name: Commit the updated question bank
        run: |
          git config user.name "question-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily collect $(date -u +%F)"
          git push
