name: Publish issue (Mon & Thu)
on:
  schedule:
    - cron: "0 6 * * 1,4"   # Monday and Thursday 06:00 UTC (11:30 IST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build a preview only (no email, nothing recorded)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: question-bank
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
      SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
      SUBSCRIBE_FORM_ACTION: ${{ vars.SUBSCRIBE_FORM_ACTION }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m iqg publish ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit the issue and the updated website
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "question-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Publish issue $(date -u +%F)"
          git push
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.dry_run }}
        with:
          name: preview
          path: preview
